<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Pax Animi Prototype</title>
<link rel="stylesheet" href="globals.css">
<style>body{background:#f3f5f7;margin:0}</style>
<style id="pax-faces">
[aria-label="How do you feel"]{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:10px!important}
[aria-label="How do you feel"] .choice{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:10px!important;padding:18px 6px 14px!important;min-height:0!important;font-size:0!important;border-radius:20px!important;border:3px solid #e3e6ea!important;background:#fff!important;box-shadow:none!important}
[aria-label="How do you feel"] .choice::before{content:"";display:block;width:78px;height:78px;background-position:center;background-size:contain;background-repeat:no-repeat}
[aria-label="How do you feel"] .choice::after{font-size:21px;font-weight:700;color:#13233a}
[aria-label="How do you feel"] .choice.good::before{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2748%27%20fill%3D%27%232E7D4F%27/%3E%3Ccircle%20cx%3D%2734%27%20cy%3D%2740%27%20r%3D%277%27%20fill%3D%27white%27/%3E%3Ccircle%20cx%3D%2766%27%20cy%3D%2740%27%20r%3D%277%27%20fill%3D%27white%27/%3E%3Cpath%20d%3D%27M28%2060%20Q50%2082%2072%2060%27%20stroke%3D%27white%27%20stroke-width%3D%278%27%20fill%3D%27none%27%20stroke-linecap%3D%27round%27/%3E%3C/svg%3E")}
[aria-label="How do you feel"] .choice.meh::before{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2748%27%20fill%3D%27%23E0A800%27/%3E%3Ccircle%20cx%3D%2734%27%20cy%3D%2740%27%20r%3D%277%27%20fill%3D%27white%27/%3E%3Ccircle%20cx%3D%2766%27%20cy%3D%2740%27%20r%3D%277%27%20fill%3D%27white%27/%3E%3Cpath%20d%3D%27M30%2066%20L70%2066%27%20stroke%3D%27white%27%20stroke-width%3D%278%27%20stroke-linecap%3D%27round%27/%3E%3C/svg%3E")}
[aria-label="How do you feel"] .choice.bad::before{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2748%27%20fill%3D%27%23C0392B%27/%3E%3Ccircle%20cx%3D%2734%27%20cy%3D%2740%27%20r%3D%277%27%20fill%3D%27white%27/%3E%3Ccircle%20cx%3D%2766%27%20cy%3D%2740%27%20r%3D%277%27%20fill%3D%27white%27/%3E%3Cpath%20d%3D%27M28%2074%20Q50%2052%2072%2074%27%20stroke%3D%27white%27%20stroke-width%3D%278%27%20fill%3D%27none%27%20stroke-linecap%3D%27round%27/%3E%3C/svg%3E")}
[aria-label="How do you feel"] .choice.good::after{content:"Good"}
[aria-label="How do you feel"] .choice.meh::after{content:"Okay"}
[aria-label="How do you feel"] .choice.bad::after{content:"Bad"}
[aria-label="How do you feel"] .choice.good[aria-pressed="true"]{border-color:#2E7D4F!important;background:#E7F4EC!important}
[aria-label="How do you feel"] .choice.meh[aria-pressed="true"]{border-color:#E0A800!important;background:#FFF6D6!important}
[aria-label="How do you feel"] .choice.bad[aria-pressed="true"]{border-color:#C0392B!important;background:#FBE9E7!important}
</style>
</head>
